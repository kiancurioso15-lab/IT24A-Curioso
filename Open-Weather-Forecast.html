<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
</head>
<body>

    <h1>Weather Forecast Application</h1>

    <h2>Select Location</h2>

    <button onclick="getGPSLocation()">Use My GPS</button>
    <button onclick="getWeather()">Manual Location</button>

    <p id="locationResult"></p>

    <hr>

    <div id="weatherResult"></div>

    <div id="forecastResult"></div>

</body>
<script>
const apiKey = "6b1bc3060b2811c66eafedeb029ce310";

async function getWeather() {
    const city = prompt("Enter a city name");

    if (!city) {
        alert("No city entered");
        return;
    }

    const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("City not found");
        }

        const data = await response.json();
        await getWeatherByCoordinates(data.coord.lat, data.coord.lon);
    } catch (error) {
        alert("Error: " + error.message);
    }
}

function getGPSLocation() {
    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    document.getElementById("locationResult").innerHTML = "Getting your location...";

    navigator.geolocation.getCurrentPosition(
        function (position) {
            getWeatherByCoordinates(position.coords.latitude, position.coords.longitude);
        },
        function (error) {
            document.getElementById("locationResult").innerHTML = "";
            alert("GPS Error: " + error.message);
        }
    );
}

async function getWeatherByCoordinates(latitude, longitude) {
    const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;
    const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;

    try {
        const weatherResponse = await fetch(weatherUrl);

        if (!weatherResponse.ok) {
            throw new Error("Unable to retrieve weather");
        }

        const data = await weatherResponse.json();

        document.getElementById("locationResult").innerHTML =
            `Location: ${data.name}, ${data.sys.country}`;

        document.getElementById("weatherResult").innerHTML = `
            <h2>Current Weather</h2>
            <h3>${data.name}, ${data.sys.country}</h3>
            <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="${data.weather[0].description}">
            <p>Temperature: ${data.main.temp} °C</p>
            <p>Weather: ${data.weather[0].description}</p>
            <p>Humidity: ${data.main.humidity}%</p>
            <p>Wind Speed: ${data.wind.speed} m/s</p>
        `;

        const forecastResponse = await fetch(forecastUrl);

        if (!forecastResponse.ok) {
            throw new Error("Unable to retrieve forecast");
        }

        const forecastData = await forecastResponse.json();

        const forecastHtml = forecastData.list
            .slice(0, 5)
            .map(item => `
                <div class="forecast-item">
                    <p>${new Date(item.dt * 1000).toLocaleString()}</p>
                    <img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png" alt="${item.weather[0].description}">
                    <p>${item.main.temp} °C</p>
                    <p>${item.weather[0].description}</p>
                </div>
            `)
            .join("");

        document.getElementById("forecastResult").innerHTML = `
            <h2>Forecast</h2>
            ${forecastHtml}
        `;
    } catch (error) {
        alert("Error: " + error.message);
    }
}
</script>
</html>
