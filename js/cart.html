<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review and update your Storia Cafe shopping cart.">
  <title>Your Cart — Storia Cafe</title><link rel="stylesheet" href="css/styles.css">
  <script defer src="js/data.js"></script><script defer src="js/ui.js"></script><script defer src="js/cart.js"></script><script defer src="js/menu.js"></script><script defer src="js/orders.js"></script>
</head>
<body><div data-site-header></div><main>
  <section class="page-hero"><div class="shell"><span class="eyebrow">One step closer</span><h1>Your cart.</h1><p>Take a look, make it yours, and we’ll get everything ready.</p></div></section>
  <section class="section" style="padding-top:8px"><div class="shell">
    <ol class="progress" aria-label="Order progress"><li data-step="1"><a href="menu.html">Menu</a></li><li class="is-active" data-step="2">Cart</li><li data-step="3">Checkout</li><li data-step="4">Confirmation</li><li data-step="5">Details</li></ol>
    <div class="cart-layout"><div class="content-card" id="cart-items" aria-live="polite"></div>
      <aside class="content-card summary-card" id="cart-summary"><h2>Order summary</h2><div class="summary-row"><span>Subtotal</span><strong id="subtotal">₱0</strong></div><div class="summary-row"><span>Delivery / service</span><span>Calculated at checkout</span></div><div class="summary-row total"><span>Total</span><strong id="total">₱0</strong></div><a class="button" href="checkout.html">Proceed to checkout</a><a class="button secondary" href="menu.html">← Continue shopping</a></aside>
    </div>
  </div></section>
</main><div data-site-footer></div></body></html>
