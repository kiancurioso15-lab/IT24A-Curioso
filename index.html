<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
    <style>
        #map {
            height: 500px;
            width: 100%;
        }

        #locations {
            width: 250px;
        }

        .location {
            padding: 10px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .location:hover {
            background-color: aliceblue;
        }

        .container {
            display: flex;
            gap: 15px;
        }

        .popup-image {
            max-width: 250px;
            height: auto;
            object-fit: fill;
        }
    </style>
</head>
<body>
    <h1>Simple Map</h1>
    <h2>Maps</h2>

    <div class="container">
        <div id="locations">
            <h3>Locations</h3>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script>
        function initMap(mapDataUrl) {
            const map = L.map('map').setView([8.35955, 124.868], 16);

            const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            const satellite = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                {
                    maxZoom: 19,
                    attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics, and GIS User Community'
                }
            );

            L.control.layers({
                "OpenStreetMap": openStreetMap,
                "Satellite": satellite
            }).addTo(map);

            fetch(mapDataUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load campus map data: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const locationsContainer = document.getElementById('locations');
                    locationsContainer.innerHTML = '';

                    data.forEach(pin => {
                        const latitude = pin.lat ?? pin.latitude;
                        const longitude = pin.lng ?? pin.long ?? pin.longitude;

                        if (latitude == null || longitude == null) return;

                        const marker = L.marker([latitude, longitude]).addTo(map);
                        const image = `<img src="${pin.img}" class="popup-image" alt="${pin.name}">`;
                        marker.bindPopup(`
                            <strong>${pin.title || pin.name}</strong><br>
                            <hr>
                            ${image}
                        `);

                        const item = document.createElement('div');
                        item.className = 'location';
                        item.textContent = pin.title || pin.name;
                        item.onclick = () => {
                            map.flyTo([latitude, longitude], 18);
                            marker.openPopup();
                        };

                        locationsContainer.appendChild(item);
                    });
                });
        }

        initMap('./campus-map.json');
    </script>
</body>
</html>
