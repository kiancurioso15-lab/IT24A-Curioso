<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

</head>
<style>
    #map {
        height: 500px;
        }
    #locations{
        width: 250px;

    }
    .location{
        padding: 10px;
        border: 1px solid #ddd;
        cursor: pointer;
    }
    .location:hover{
        background-color: aliceblue;

    }
    .container{
        display: flex;
        gap: 15px;

    }
    .popup-image {
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }
    
</style>
<body>
    <h1>Simple Map</h1>
    <h2>Maps</h2>

    <div class="container">
        <div id="locations">
            <h3>Locations</h3>
        </div> 
        <div id="location-list" ></div>
    </div>
    <div id="map"></div>
</body>

<script>
    function initMap(mapDataUrl) {
        const map = L.map('map').setView([8.360, 124.868], 17);

        const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics, and GIS User Community'
            }
        );

        const baseMaps = {
            "OpenStreetMap": openStreetMap,
            "Satellite": satellite
        };

        L.control.layers(baseMaps).addTo(map);

        fetch(mapDataUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to load map data: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                const locationsContainer = document.getElementById('locations');
                locationsContainer.innerHTML = '';

                data.forEach(pin => {
                    const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                    const image = `<img src="${pin.img}" alt="${pin.name}" class="popup-image">`;

                    marker.bindPopup(`
                        <strong>${pin.title}</strong><br>
                        <hr>
                        ${image}
                    `);
                      

                    //flyto
                    
                    const item = document.createElement('div');
                    
                    item.className = 'location';
                    item.textContent = pin.title || pin.name;

                    document.getElementById('locations').appendChild(item);

                    item.onclick = () => {
                        map.flyTo([pin.lat, pin.lng], 18);
                        marker.openPopup();
                    }   ;

                    locationsContainer.appendChild(item);
                });

                L.controllayers(baseMaps).addTo(map);

                })
            }

    initMap('campus-map.json');
</script>
</html>
